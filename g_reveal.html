<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חשיפת תמונה - ארקייד</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f8fafc; padding: 100px 20px 40px 20px; }
        
        .global-navbar { width: 100%; background-color: #0f172a; border-bottom: 1px solid #334155; position: fixed; top: 0; left: 0; z-index: 1000; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; max-width: 1200px; margin: 0 auto; }
        .nav-brand { font-size: 20px; font-weight: bold; color: #3b82f6; text-decoration: none; }
        .nav-toggle-btn { background: none; border: 1px solid #334155; color: #f8fafc; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .nav-dropdown { display: none; width: 100%; background-color: #0f172a; border-bottom: 1px solid #334155; position: absolute; top: 100%; left: 0; box-shadow: 0 10px 20px rgba(0,0,0,0.3); padding: 10px 0; }
        .nav-dropdown.show { display: block; }
        .nav-links-list { list-style: none; max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 4px; }
        .nav-link-item a { display: block; padding: 12px 16px; color: #cbd5e1; text-decoration: none; border-radius: 6px; font-weight: 500; }
        .nav-link-item a:hover { background-color: #1e293b; color: #3b82f6; padding-right: 24px; }

        .game-container { text-align: center; background-color: #1e293b; padding: 36px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); max-width: 480px; width: 100%; border: 1px solid #334155; }
        h1 { margin-bottom: 6px; font-size: 26px; font-weight: 700; }
        .status-panel { margin-bottom: 20px; font-size: 15px; color: #94a3b8; }
        .level-badge { display: inline-block; background-color: #3b82f6; padding: 5px 14px; border-radius: 20px; font-weight: bold; margin-bottom: 14px; font-size: 13px; }

        .image-stage { position: relative; width: 360px; height: 360px; margin: 0 auto 20px auto; border-radius: 12px; overflow: hidden; border: 1px solid #334155; background-color: #0f172a; }
        .hidden-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .grid-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px; z-index: 2; }
        
        .cover-tile { background-color: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; z-index: 3; }
        .cover-tile:hover { background-color: #334155; color: #f8fafc; }
        /* התיקון המרכזי: הפיכת הריבוע לשקוף לחלוטין ברגע שהוא נחשף */
        .cover-tile.revealed { background-color: transparent !important; border: none; color: transparent; pointer-events: none; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.9); z-index: 10; justify-content: center; align-items: center; }
        .modal-content { background-color: #1e293b; color: #f8fafc; padding: 32px; border-radius: 16px; width: 90%; max-width: 440px; text-align: center; border: 1px solid #334155; }
        .question-text { font-size: 19px; font-weight: 600; margin-bottom: 24px; color: #f1f5f9; }
        .answers-list { display: flex; flex-direction: column; gap: 12px; }
        .answer-btn { padding: 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; font-size: 16px; color: #cbd5e1; cursor: pointer; transition: all 0.2s; text-align: right; }
        .answer-btn:hover { background-color: #334155; color: #f8fafc; border-color: #3b82f6; }

        .feedback-toast { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 18px 36px; border-radius: 12px; font-size: 20px; font-weight: bold; color: white; z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .feedback-toast.correct { background-color: #10b981; } .feedback-toast.wrong { background-color: #ef4444; }
        .next-lvl-btn { display: none; margin: 15px auto 0 auto; padding: 12px 30px; background-color: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="global-navbar">
        <div class="nav-container">
            <a href="g_menu.html" class="nav-brand">🕹️ ARCADE</a>
            <button class="nav-toggle-btn" id="navToggleBtn">☰ ניווט מהיר</button>
        </div>
        <div class="nav-dropdown" id="navDropdown">
            <ul class="nav-links-list">
                <li class="nav-link-item"><a href="g_menu.html">🏠 תפריט ראשי</a></li>
                <li class="nav-link-item"><a href="g_game.html">🎯 משחק: מציאת המספר</a></li>
                <li class="nav-link-item"><a href="g_simon.html">🧠 משחק: סיימון אמר</a></li>
                <li class="nav-link-item"><a href="g_reveal.html">🖼️ משחק: חשיפת תמונה</a></li>
                <li class="nav-link-item logout-item"><a href="#" id="menuLogoutLink">🚪 התנתק מהחשבון</a></li>
            </ul>
        </div>
    </nav>

    <div class="game-container">
        <div class="level-badge" id="levelBadge">שלב 1 - קל</div>
        <h1>חשיפת התמונה</h1>
        <div class="status-panel">לחצו על הריבועים וענו על השאלות.</div>

        <div class="image-stage">
            <img class="hidden-image" id="gameImage" src="" alt="סודי">
            <div class="grid-overlay" id="gridOverlay"></div>
        </div>

        <button class="next-lvl-btn" id="nextLevelBtn">המשך לשלב הבא ➔</button>
    </div>

    <div class="modal" id="questionModal">
        <div class="modal-content">
            <div class="question-text" id="questionText">שאלה...</div>
            <div class="answers-list" id="answersList"></div>
        </div>
    </div>

    <div class="feedback-toast" id="feedbackToast"></div>

    <script>
        // שימוש בתיקיית images כפי שביקשת
        const levelImages = ['images/level1.jpg', 'images/level2.jpg', 'images/level3.jpg'];

        const questionsPool = {
            easy: [
                { q: "מהי בירת צרפת?", a: ["רומא", "לונדון", "ברלין", "פריז"], correct: 3 },
                { q: "כמה ימים יש בשנה רגילה?", a: ["360", "365", "366", "354"], correct: 1 },
                { q: "מהו בעל החיים היבשתי המהיר ביותר?", a: ["ברדלס", "אריה", "זברה", "פיל"], correct: 0 },
                { q: "כמה צבעים יש בקשת בענן?", a: ["5", "6", "7", "8"], correct: 2 },
                { q: "איזה כוכב לכת הכי קרוב לשמש?", a: ["נוגה", "כוכב חמה", "מאדים", "צדק"], correct: 1 },
                { q: "מהו האוקיינוס הגדול בעולם?", a: ["האטלנטי", "השקט", "ההודי", "הארקטי"], correct: 1 },
                { q: "מהי בירת ישראל?", a: ["תל אביב", "חיפה", "ירושלים", "אילת"], correct: 2 },
                { q: "כמה חודשים יש בשנה?", a: ["10", "11", "12", "13"], correct: 2 },
                { q: "מהי השפה הרשמית בברזיל?", a: ["ספרדית", "פורטוגזית", "אנגלית", "ברזילאית"], correct: 1 }
            ],
            medium: [
                { q: "כמה יבשות יש בכדור הארץ?", a: ["5", "6", "7", "8"], correct: 2 },
                { q: "איזה איבר בגוף אחראי על סינון הדם?", a: ["לב", "ריאות", "כליות", "כבד"], correct: 2 },
                { q: "מהו כוכב הלכת הגדול ביותר במערכת השמש שלנו?", a: ["צדק", "שבתאי", "מאדים", "כדור הארץ"], correct: 0 },
                { q: "מהי המתכת הנוזלית היחידה בטמפרטורת החדר?", a: ["ברזל", "כספית", "נחושת", "אבץ"], correct: 1 },
                { q: "מהו היסוד הכי נפוץ ביקום?", a: ["חמצן", "מימן", "פחמן", "חנקן"], correct: 1 },
                { q: "איזה חומר הוא הקשה ביותר בטבע?", a: ["יהלום", "ברזל", "גרפיט", "פלטינה"], correct: 0 },
                { q: "באיזו יבשת נמצא מדבר סהרה?", a: ["אסיה", "אפריקה", "אירופה", "אוסטרליה"], correct: 1 },
                { q: "מהו הסמל הכימי של מים?", a: ["CO2", "O2", "H2O", "NaCl"], correct: 2 },
                { q: "כמה צלעות יש למשושה?", a: ["5", "6", "7", "8"], correct: 1 }
            ],
            hard: [
                { q: "מהו אורך קו המשווה של כדור הארץ בקירוב?", a: ["20,000 ק\"מ", "40,000 ק\"מ", "60,000 ק\"מ", "80,000 ק\"מ"], correct: 1 },
                { q: "באיזו שנה פרצה מלחמת העולם הראשונה?", a: ["1914", "1918", "1939", "1945"], correct: 0 },
                { q: "מהו האי הגדול ביותר בעולם?", a: ["אוסטרליה", "גרינלנד", "מדגסקר", "איסלנד"], correct: 1 },
                { q: "איזו קבוצת דם נחשבת לתורם אוניברסלי?", a: ["A+", "B-", "AB+", "O-"], correct: 3 },
                { q: "מי היה הנשיא הראשון של מדינת ישראל?", a: ["בן גוריון", "חיים ויצמן", "יצחק בן צבי", "זלמן שזר"], correct: 1 },
                { q: "מהו המרחק הממוצע מהארץ לשמש?", a: ["150 מיליון ק\"מ", "50 מיליון ק\"מ", "300 מיליון ק\"מ", "1 מיליארד ק\"מ"], correct: 0 },
                { q: "איזו מדינה היא הגדולה ביותר בשטחה בעולם?", a: ["קנדה", "ארה\"ב", "סין", "רוסיה"], correct: 3 },
                { q: "כמה עצמות יש בגוף אדם בוגר?", a: ["106", "206", "306", "406"], correct: 1 },
                { q: "מהו עומק האוקיינוסים המקסימלי הידוע?", a: ["כ-5 ק\"מ", "כ-11 ק\"מ", "כ-20 ק\"מ", "כ-2 ק\"מ"], correct: 1 }
            ]
        };

        let currentLevel = 1; let currentLevelPool = []; let tilesQuestions = {}; let currentTileIndex = null; let revealedCount = 0;

        function startNewLevel() {
            revealedCount = 0; document.getElementById('nextLevelBtn').style.display = 'none';
            const badge = document.getElementById('levelBadge'); const imgElement = document.getElementById('gameImage');
            
            if (currentLevel === 1) {
                badge.textContent = "שלב 1 - קל"; badge.style.backgroundColor = "#3b82f6";
                currentLevelPool = [...questionsPool.easy]; imgElement.src = levelImages[0];
            } else if (currentLevel === 2) {
                badge.textContent = "שלב 2 - בינוני"; badge.style.backgroundColor = "#f59e0b";
                currentLevelPool = [...questionsPool.medium]; imgElement.src = levelImages[1];
            } else {
                badge.textContent = "שלב 3 - קשה"; badge.style.backgroundColor = "#ef4444";
                currentLevelPool = [...questionsPool.hard]; imgElement.src = levelImages[2];
            }

            tilesQuestions = {};
            for (let i = 0; i < 9; i++) { tilesQuestions[i] = getRandomQuestionFromPool(); }
            buildGrid();
        }

        function getRandomQuestionFromPool() {
            if (currentLevelPool.length === 0) {
                if (currentLevel === 1) currentLevelPool = [...questionsPool.easy];
                else if (currentLevel === 2) currentLevelPool = [...questionsPool.medium];
                else currentLevelPool = [...questionsPool.hard];
            }
            const randomIndex = Math.floor(Math.random() * currentLevelPool.length);
            const question = currentLevelPool[randomIndex];
            currentLevelPool.splice(randomIndex, 1); return question;
        }

        function buildGrid() {
            const gridOverlay = document.getElementById('gridOverlay'); gridOverlay.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const tile = document.createElement('button'); tile.classList.add('cover-tile');
                tile.id = `tile-${i}`; tile.textContent = i + 1;
                tile.addEventListener('click', () => openQuestion(i)); gridOverlay.appendChild(tile);
            }
        }

        function openQuestion(index) {
            currentTileIndex = index; const questionData = tilesQuestions[index];
            document.getElementById('questionText').textContent = questionData.q;
            const answersList = document.getElementById('answersList'); answersList.innerHTML = '';

            questionData.a.forEach((answerText, i) => {
                const btn = document.createElement('button'); btn.classList.add('answer-btn');
                btn.textContent = answerText; btn.addEventListener('click', () => checkAnswer(i));
                answersList.appendChild(btn);
            });
            document.getElementById('questionModal').style.display = 'flex';
        }

        function checkAnswer(selectedIndex) {
            const questionData = tilesQuestions[currentTileIndex]; document.getElementById('questionModal').style.display = 'none';

            if (selectedIndex === questionData.correct) {
                showToast("תשובה נכונה!", "correct");
                document.getElementById(`tile-${currentTileIndex}`).classList.add('revealed'); revealedCount++;

                if (revealedCount === 9) {
                    setTimeout(() => {
                        if (currentLevel < 3) { document.getElementById('nextLevelBtn').style.display = 'block'; } 
                        else { showToast("🏆 ניצחתם את כל השלבים!", "correct"); }
                    }, 1500);
                }
            } else {
                showToast("תשובה שגויה... שאלה חדשה הוגרלה!", "wrong");
                tilesQuestions[currentTileIndex] = getRandomQuestionFromPool();
            }
        }

        function showToast(text, type) {
            const toast = document.getElementById('feedbackToast'); toast.textContent = text;
            toast.className = `feedback-toast ${type}`; toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 1500);
        }

        document.getElementById('nextLevelBtn').addEventListener('click', () => { currentLevel++; startNewLevel(); });

        document.addEventListener('DOMContentLoaded', () => {
            const loggedInLocal = localStorage.getItem('isLoggedIn') === 'true';
            const loggedInSession = sessionStorage.getItem('isLoggedIn') === 'true';
            if (!loggedInLocal && !loggedInSession) { window.location.href = 'g_enter.html'; return; }

            const toggleBtn = document.getElementById('navToggleBtn');
            const dropdown = document.getElementById('navDropdown');
            toggleBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('show'); });
            document.addEventListener('click', () => dropdown.classList.remove('show'));

            document.getElementById('menuLogoutLink').addEventListener('click', (e) => {
                e.preventDefault(); localStorage.clear(); sessionStorage.clear(); window.location.href = 'g_enter.html';
            });
            startNewLevel();
        });
    </script>
</body>
</html>
