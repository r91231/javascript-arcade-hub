<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה - ארקייד</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); display: flex; flex-direction: column; min-height: 100vh; color: #f8fafc; }
        
        .top-navbar { width: 100%; background-color: #0f172a; border-bottom: 1px solid #334155; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; z-index: 100; }
        .nav-logo { font-size: 18px; font-weight: bold; color: #3b82f6; }
        .nav-guest { font-size: 14px; color: #94a3b8; }

        .page-content { flex: 1; display: flex; justify-content: center; align-items: center; padding-top: 80px; padding-bottom: 40px; }
        .login-container { background-color: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); width: 100%; max-width: 400px; border: 1px solid #334155; }
        h2 { margin-bottom: 24px; text-align: center; color: #f1f5f9; font-weight: 600; letter-spacing: -0.5px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px 16px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; font-size: 16px; color: #f8fafc; transition: border-color 0.2s; }
        .input-group input:focus { outline: none; border-color: #3b82f6; }
        .form-options { margin-bottom: 24px; font-size: 14px; }
        .remember-me { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #94a3b8; }
        .remember-me input { cursor: pointer; accent-color: #3b82f6; }
        .btn-submit { width: 100%; padding: 14px; background-color: #3b82f6; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .btn-submit:hover { background-color: #2563eb; }
        .form-footer { margin-top: 20px; text-align: center; font-size: 14px; color: #94a3b8; }
        .form-footer a { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .form-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="nav-logo">🕹️ ARCADE</div>
        <div class="nav-guest">מצב: אורח</div>
    </div>

    <div class="page-content">
        <div class="login-container">
            <h2>כניסה לחשבון</h2>
            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <label for="loginIdentifier">שם משתמש או אימייל</label>
                    <input type="text" id="loginIdentifier" placeholder="הכנס שם משתמש או אימייל" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">סיסמה</label>
                    <input type="password" id="password" placeholder="הכנס סיסמה" required autocomplete="current-password">
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>זכור אותי במחשב זה</span>
                    </label>
                </div>
                <button type="submit" class="btn-submit">התחברות</button>
            </form>
            <div class="form-footer">
                <p>עדיין אין לך חשבון? <a href="g.html">להרשמה לחץ כאן</a></p>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'g_menu.html';
                return;
            }
            setTimeout(() => { document.getElementById('loginForm').reset(); }, 50);
        };

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const identifierInput = document.getElementById('loginIdentifier').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            const usersList = JSON.parse(localStorage.getItem('usersList')) || [];
            const matchedUser = usersList.find(user => user.username.toLowerCase() === identifierInput || user.email.toLowerCase() === identifierInput);

            if (!matchedUser) { alert('שם המשתמש או האימייל לא נמצאו במערכת!'); return; }

            if (matchedUser.password === passwordInput) {
                localStorage.setItem('currentUser', JSON.stringify(matchedUser));
                if (rememberMe) { localStorage.setItem('isLoggedIn', 'true'); } 
                else { localStorage.removeItem('isLoggedIn'); sessionStorage.setItem('isLoggedIn', 'true'); }
                
                alert(`ברוך הבא, ${matchedUser.username}! מועבר לתפריט...`);
                window.location.href = 'g_menu.html';
            } else {
                alert('הסיסמה שהוקשה שגויה. נסו שוב.');
            }
        });
    </script>
</body>
</html>
