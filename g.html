<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמה - ארקייד</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); display: flex; flex-direction: column; min-height: 100vh; color: #f8fafc; }
        
        /* תפריט עליון בסיסי לפני התחברות */
        .top-navbar { width: 100%; background-color: #0f172a; border-bottom: 1px solid #334155; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; z-index: 100; }
        .nav-logo { font-size: 18px; font-weight: bold; color: #3b82f6; }
        .nav-guest { font-size: 14px; color: #94a3b8; }

        .page-content { flex: 1; display: flex; justify-content: center; align-items: center; padding-top: 80px; padding-bottom: 40px; }
        .register-container { background-color: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); width: 100%; max-width: 400px; border: 1px solid #334155; }
        h2 { margin-bottom: 24px; text-align: center; color: #f1f5f9; font-weight: 600; letter-spacing: -0.5px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px 16px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; font-size: 16px; color: #f8fafc; transition: border-color 0.2s; }
        .input-group input:focus { outline: none; border-color: #3b82f6; }
        .error-message { color: #ef4444; font-size: 13px; margin-top: 6px; display: none; }
        .btn-submit { width: 100%; padding: 14px; background-color: #3b82f6; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .btn-submit:hover { background-color: #2563eb; }
        .form-footer { margin-top: 20px; text-align: center; font-size: 14px; color: #94a3b8; }
        .form-footer a { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .form-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="nav-logo">🕹️ ARCADE</div>
        <div class="nav-guest">מצב: אורח</div>
    </div>

    <div class="page-content">
        <div class="register-container">
            <h2>יצירת חשבון חדש</h2>
            <form id="registerForm" autocomplete="off">
                <div class="input-group">
                    <label for="username">שם משתמש ייחודי</label>
                    <input type="text" id="username" placeholder="הכנס שם משתמש" required autocomplete="off">
                    <span class="error-message" id="usernameError">שם המשתמש חייב להכיל לפחות 3 תווים</span>
                </div>
                <div class="input-group">
                    <label for="email">כתובת אימייל</label>
                    <input type="email" id="email" placeholder="example@domain.com" required autocomplete="off">
                    <span class="error-message" id="emailError">נא להזין כתובת אימייל תקינה</span>
                </div>
                <div class="input-group">
                    <label for="password">סיסמה</label>
                    <input type="password" id="password" placeholder="לפחות 6 תווים" required autocomplete="new-password">
                    <span class="error-message" id="passwordError">הסיסמה קצרה מדי</span>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">אימות סיסמה</label>
                    <input type="password" id="confirmPassword" placeholder="הקש את הסיסמה שוב" required autocomplete="new-password">
                    <span class="error-message" id="confirmPasswordError">הסיסמאות אינן תואמות</span>
                </div>
                <button type="submit" class="btn-submit">הרשמה והמשך</button>
            </form>
            <div class="form-footer">
                <p>כבר יש לך חשבון? <a href="g_enter.html">להתחברות לחץ כאן</a></p>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            setTimeout(() => {
                document.getElementById('registerForm').reset();
            }, 50);
        };

        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            let isValid = true;

            if (username.length < 3) { document.getElementById('usernameError').style.display = 'block'; isValid = false; } 
            else { document.getElementById('usernameError').style.display = 'none'; }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) { document.getElementById('emailError').style.display = 'block'; isValid = false; } 
            else { document.getElementById('emailError').style.display = 'none'; }

            if (password.length < 6) { document.getElementById('passwordError').style.display = 'block'; isValid = false; } 
            else { document.getElementById('passwordError').style.display = 'none'; }

            if (password !== confirmPassword) { document.getElementById('confirmPasswordError').style.display = 'block'; isValid = false; } 
            else { document.getElementById('confirmPasswordError').style.display = 'none'; }

            if (isValid) {
                let usersList = JSON.parse(localStorage.getItem('usersList')) || [];
                const userExists = usersList.some(user => user.username.toLowerCase() === username.toLowerCase() || user.email.toLowerCase() === email.toLowerCase());

                if (userExists) {
                    alert('שם המשתמש או כתובת האימייל כבר קיימים במערכת!');
                    return;
                }

                usersList.push({ username, email, password });
                localStorage.setItem('usersList', JSON.stringify(usersList));
                alert('ההרשמה בוצעה בהצלחה! מועבר לדף הכניסה.');
                window.location.href = 'g_enter.html';
            }
        });
    </script>
</body>
</html>
